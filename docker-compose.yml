version: '3.8'

services:
  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - soc-network

  server:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - AI_ENGINE_URL=http://ai-engine:5001
    depends_on:
      - mongo
#      - redis
      - ai-engine
    networks:
      - soc-network

  ai-engine:
    build: ./ai-engine
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
    networks:
      - soc-network

  mongo:
    image: mongo:latest
    volumes:
      - mongo-data:/data/db
    networks:
      - soc-network

#  redis:
#    image: redis:alpine
#    networks:
#      - soc-network

networks:
  soc-network:
    driver: bridge

volumes:
  mongo-data:
